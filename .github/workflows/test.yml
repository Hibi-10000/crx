name: Test

on:
  push:
    branches:
      - fork/master
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        node-version: [18.x, 20.x, 22.x, 24.x]
        os: [ubuntu-latest]
        include:
          - node-version: 18.x
            allow-failure: true
          - node-version: 24.x
            os: windows-latest
            allow-failure: true

    steps:
    - uses: actions/checkout@v6

    - name: Setup pnpm
      uses: pnpm/action-setup@v4
      with:
        version: ^10
        run_install: false

    - name: Setup Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v6
      with:
        node-version: ${{ matrix.node-version }}
        cache: "pnpm"

    - name: Install dependencies and Run tests
      run: pnpm install-test
      continue-on-error: ${{ matrix.allow-failure || false }}

    - name: Run CLI commands
      run: |
        pnpm build

        node ./dist/index.js keygen ./test --force
        node ./dist/index.js pack ./test/myFirstExtension -p ./test/key.pem -o test.crx
        node ./dist/index.js pack ./test/myFirstExtension --zip-output test.zip
      continue-on-error: ${{ matrix.allow-failure || false }}
