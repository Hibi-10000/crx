name: Build

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v6

    - name: Setup pnpm
      uses: pnpm/action-setup@v4
      with:
        version: ^10
        run_install: false

    - name: Setup Node.js
      uses: actions/setup-node@v6
      with:
        node-version-file: package.json
        cache: "pnpm"

    - name: Install dependencies
      run: pnpm install
    
    - name: Build
      run: pnpm run build

    - name: Upload build artifact
      uses: actions/upload-artifact@v6
      with:
        path: ./dist
        name: dist
