name: Build

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7

    - name: Setup pnpm
      uses: pnpm/action-setup@v6
      with:
        version: ^11
        run_install: false

    - name: Setup Node.js
      uses: actions/setup-node@v7
      with:
        node-version-file: package.json
        cache: "pnpm"

    - name: Install dependencies
      run: pnpm ci
    
    - name: Build
      run: pnpm run build

    - name: Upload build artifact
      uses: actions/upload-artifact@v7
      with:
        path: ./dist
        name: dist
